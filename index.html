<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeopardy! Studio Live - Deluxe TV Edition</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Bebas Neue, Oswald, PT Serif, Cinzel, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;900&family=Oswald:wght@500;700&family=PT+Serif:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  
  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for in-browser JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: #020617;
    }
    .font-board {
      font-family: 'Oswald', Impact, sans-serif;
      letter-spacing: 0.05em;
    }
    .font-title {
      font-family: 'Cinzel', serif;
    }
    .font-clue {
      font-family: 'PT Serif', Georgia, serif;
    }
    
    /* Authentic TV Studio Lighting & Glow FX */
    .glow-gold {
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.45), 0 0 50px rgba(234, 179, 8, 0.15);
    }
    .glow-blue {
      box-shadow: 0 0 30px rgba(6, 12, 233, 0.6), inset 0 0 20px rgba(59, 130, 246, 0.2);
    }
    .text-gold-shadow {
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 12px rgba(250, 204, 21, 0.45);
    }
    .text-clue-shadow {
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.95);
    }

    /* Jeopardy Board Matrix Card Gradients */
    .jeopardy-tile {
      background: linear-gradient(180deg, #0b1596 0%, #060ce9 45%, #03086e 100%);
    }
    .jeopardy-tile:hover {
      background: linear-gradient(180deg, #1825c2 0%, #0d15ff 45%, #050a99 100%);
    }
    .jeopardy-header {
      background: linear-gradient(180deg, #060b5c 0%, #040842 100%);
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #020617;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
      border: 1px solid #334155;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b82f6;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen overflow-x-hidden selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    /**
     * Broadcast Studio High-Fidelity Web Audio & Real Track Synthesizer
     * Supports real external audio files (local 'think.mp3', drag-and-drop/uploaded audio files)
     * with an upgraded polyphonic broadcast swing synthesizer fallback.
     */
    class JeopardyStudioAudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.volume = 0.6;
        this.isPlayingTheme = false;
        this.activeThemeNodes = [];
        this.themeLoopTimer = null;
        this.masterGain = null;
        this.compressor = null;

        // Real audio element configuration
        this.realAudio = new Audio();
        this.realAudio.preload = 'auto';
        this.hasRealAudio = false;
        this.realAudioName = null;
        this.useRealAudio = true; // Default to real audio if available
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
            
            // Broadcast-grade master dynamic limiter/compressor for warm, pop-free sound
            this.compressor = this.ctx.createDynamicsCompressor();
            this.compressor.threshold.setValueAtTime(-14, this.ctx.currentTime);
            this.compressor.knee.setValueAtTime(12, this.ctx.currentTime);
            this.compressor.ratio.setValueAtTime(4.5, this.ctx.currentTime);
            this.compressor.attack.setValueAtTime(0.003, this.ctx.currentTime);
            this.compressor.release.setValueAtTime(0.18, this.ctx.currentTime);

            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.setValueAtTime(this.muted ? 0 : this.volume, this.ctx.currentTime);

            this.masterGain.connect(this.compressor);
            this.compressor.connect(this.ctx.destination);
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Load real audio from file or URL
      setRealAudioSource(url, name = "think.mp3") {
        try {
          this.realAudio.pause();
          this.realAudio.src = url;
          this.realAudioName = name;
          this.hasRealAudio = true;
          this.useRealAudio = true;
          this.realAudio.volume = this.muted ? 0 : this.volume;
          this.realAudio.load();
        } catch (e) {
          console.warn("Could not load real audio file", e);
        }
      }

      setVolume(val) {
        this.volume = Math.max(0, Math.min(1, val));
        if (this.realAudio) {
          this.realAudio.volume = this.muted ? 0 : this.volume;
        }
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setTargetAtTime(
            this.muted ? 0 : this.volume,
            this.ctx.currentTime,
            0.02
          );
        }
      }

      // Pleasant TV Board Reveal harp-like glissando
      playBoardReveal() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          this.playBellTone(freq, this.ctx.currentTime + idx * 0.055, 0.45, 0.18);
        });
      }

      // Clue selection chime with studio chime overtone
      playClueSelect() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        this.playBellTone(587.33, now, 0.2, 0.22);       // D5
        this.playBellTone(1174.66, now + 0.06, 0.35, 0.26); // D6
      }

      // Crisp studio contestant buzzer ding
      playBuzz() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        this.playBellTone(880, now, 0.18, 0.32);
        this.playBellTone(1320, now + 0.02, 0.28, 0.28);
      }

      // Rich studio 3-note celebration chime
      playCorrect() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        this.playBellTone(523.25, now, 0.3, 0.22);        // C5
        this.playBellTone(659.25, now + 0.09, 0.35, 0.24); // E5
        this.playBellTone(1046.50, now + 0.18, 0.75, 0.32); // C6 shimmer
        this.playBellTone(2093.00, now + 0.20, 0.5, 0.1);   // High bell harmonic
      }

      // Authentic TV show wrong answer buzzer: filtered low-frequency rumble (smooth & punchy without harsh clicks)
      playWrong() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        osc1.type = 'sawtooth';
        osc2.type = 'square';
        osc1.frequency.setValueAtTime(115, now);
        osc2.frequency.setValueAtTime(92, now);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(550, now);
        filter.Q.setValueAtTime(2.5, now);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.32, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.38);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.4);
        osc2.stop(now + 0.4);
      }

      // Daily Double classic studio fanfare with warm brass/organ chords
      playDailyDouble() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const chords = [
          { time: 0.0, freqs: [392.00, 493.88], dur: 0.12 },
          { time: 0.13, freqs: [392.00, 493.88], dur: 0.12 },
          { time: 0.26, freqs: [392.00, 493.88], dur: 0.14 },
          { time: 0.42, freqs: [523.25, 659.25], dur: 0.36 },
          { time: 0.82, freqs: [440.00, 554.37], dur: 0.15 },
          { time: 0.98, freqs: [523.25, 659.25], dur: 0.15 },
          { time: 1.15, freqs: [659.25, 783.99, 1046.50], dur: 0.85 }
        ];

        chords.forEach(c => {
          c.freqs.forEach(f => {
            this.playWarmBrassNote(f, now + c.time, c.dur, 0.22);
          });
        });
      }

      // Soft wooden studio timer tick
      playTick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(820, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.03);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1400, now);

        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.035);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 0.04);
      }

      // Soft timeout double beep
      playTimeout() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        this.playWarmBrassNote(196, now, 0.2, 0.25);
        this.playWarmBrassNote(146.83, now + 0.18, 0.35, 0.28);
      }

      // Mystery stinger for Final Jeopardy
      playFinalStinger() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [220, 277.18, 329.63, 440, 415.30, 329.63, 277.18, 220];
        notes.forEach((freq, idx) => {
          this.playBellTone(freq, now + idx * 0.16, 0.45, 0.2);
        });
      }

      // Bell/chime voice with smooth ADSR and overtone
      playBellTone(freq, startTime, duration, velocity = 0.2) {
        if (!this.ctx) return;
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc1.type = 'sine';
        osc2.type = 'triangle';
        osc1.frequency.setValueAtTime(freq, startTime);
        osc2.frequency.setValueAtTime(freq * 2.005, startTime); // subtle harmonic sparkle

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(freq * 4, startTime);
        filter.frequency.exponentialRampToValueAtTime(freq * 1.5, startTime + duration);

        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.linearRampToValueAtTime(velocity, startTime + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);

        osc1.start(startTime);
        osc2.start(startTime);
        osc1.stop(startTime + duration + 0.05);
        osc2.stop(startTime + duration + 0.05);
      }

      // Warm acoustic marimba mallet voice for the iconic "Think!" theme
      playMarimba(freq, startTime, duration, velocity = 0.24) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const overtoneOsc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);

        // Wood mallet tap transient
        overtoneOsc.type = 'sine';
        overtoneOsc.frequency.setValueAtTime(freq * 3.98, startTime);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(Math.min(freq * 4.5, 4500), startTime);
        filter.frequency.exponentialRampToValueAtTime(freq * 1.2, startTime + duration * 0.8);
        filter.Q.setValueAtTime(1.8, startTime);

        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.linearRampToValueAtTime(velocity, startTime + 0.008);
        gain.gain.exponentialRampToValueAtTime(velocity * 0.25, startTime + 0.12);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        osc.connect(filter);
        overtoneOsc.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);

        osc.start(startTime);
        overtoneOsc.start(startTime);
        osc.stop(startTime + duration);
        overtoneOsc.stop(startTime + Math.min(0.06, duration));

        this.activeThemeNodes.push(osc, overtoneOsc, gain);
      }

      // Round plucked acoustic bass voice
      playBass(freq, startTime, duration, velocity = 0.2) {
        if (!this.ctx) return;
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        osc1.type = 'sine';
        osc2.type = 'triangle';
        osc1.frequency.setValueAtTime(freq, startTime);
        osc2.frequency.setValueAtTime(freq, startTime);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(650, startTime);
        filter.frequency.exponentialRampToValueAtTime(180, startTime + duration);

        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.linearRampToValueAtTime(velocity, startTime + 0.012);
        gain.gain.exponentialRampToValueAtTime(velocity * 0.45, startTime + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);

        osc1.start(startTime);
        osc2.start(startTime);
        osc1.stop(startTime + duration);
        osc2.stop(startTime + duration);

        this.activeThemeNodes.push(osc1, osc2, gain);
      }

      // Warm brass/pad note
      playWarmBrassNote(freq, startTime, duration, velocity = 0.2) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, startTime);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, startTime);
        filter.frequency.linearRampToValueAtTime(2200, startTime + 0.08);
        filter.frequency.exponentialRampToValueAtTime(600, startTime + duration);

        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.linearRampToValueAtTime(velocity, startTime + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);

        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }

      // Percussion click/rimshot for the authentic 1980s/1990s TV syncopation
      playPercussionBeat(startTime, velocity = 0.08) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1400, startTime);
        osc.frequency.exponentialRampToValueAtTime(120, startTime + 0.03);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1800, startTime);
        filter.Q.setValueAtTime(3.0, startTime);

        gain.gain.setValueAtTime(velocity, startTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.035);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);

        osc.start(startTime);
        osc.stop(startTime + 0.04);
        this.activeThemeNodes.push(osc, gain);
      }

      // Play either the real audio file or the synthesized TV broadcast theme
      startJeopardyTheme(onComplete = null) {
        this.stopJeopardyTheme();

        // 1. If real audio is loaded and user wants real audio, play actual audio recording
        if (this.useRealAudio && this.hasRealAudio && this.realAudio) {
          try {
            this.realAudio.currentTime = 0;
            this.realAudio.volume = this.muted ? 0 : this.volume;
            this.isPlayingTheme = true;

            const playPromise = this.realAudio.play();
            if (playPromise !== undefined) {
              playPromise.catch((err) => {
                console.warn("Real audio autoplay was blocked or file missing; falling back to synthesizer.", err);
                this.startSynthTheme(onComplete);
              });
            }

            this.realAudio.onended = () => {
              this.isPlayingTheme = false;
              if (onComplete) onComplete();
            };
            return;
          } catch (e) {
            console.warn("Real audio playback failed, falling back to synth", e);
          }
        }

        // 2. Synthesized arrangement fallback
        this.startSynthTheme(onComplete);
      }

      // Broadcast TV live synthesizer arrangement
      startSynthTheme(onComplete = null) {
        this.init();
        if (!this.ctx) return;
        this.isPlayingTheme = true;

        const startTime = this.ctx.currentTime + 0.05;
        const C3 = 130.81, D3 = 146.83, E3 = 164.81, F3 = 174.61, G3 = 196.00, A3 = 220.00, Bb3 = 233.08, B3 = 246.94;
        const C4 = 261.63, D4 = 293.66, E4 = 329.63, F4 = 349.23, G4 = 392.00, A4 = 440.00, Bb4 = 466.16, B4 = 493.88;
        const C5 = 523.25, D5 = 587.33, E5 = 659.25, F5 = 698.46, G5 = 783.99, A5 = 880.00, B5 = 987.77;

        // Sample-accurate marimba melody
        const melody = [
          // Phrase 1
          { f: C5, d: 0.32, t: 0.0 }, { f: F5, d: 0.32, t: 0.4 }, { f: C5, d: 0.32, t: 0.8 }, { f: F4, d: 0.32, t: 1.2 },
          { f: C5, d: 0.32, t: 1.6 }, { f: F5, d: 0.32, t: 2.0 }, { f: C5, d: 0.65, t: 2.4 },

          // Phrase 2
          { f: C5, d: 0.32, t: 3.2 }, { f: F5, d: 0.32, t: 3.6 }, { f: C5, d: 0.32, t: 4.0 }, { f: F5, d: 0.32, t: 4.4 },
          { f: A5, d: 0.45, t: 4.8 }, { f: G5, d: 0.32, t: 5.3 }, { f: F5, d: 0.32, t: 5.7 }, { f: E5, d: 0.32, t: 6.1 },

          // Phrase 3
          { f: C5, d: 0.32, t: 6.8 }, { f: F5, d: 0.32, t: 7.2 }, { f: C5, d: 0.32, t: 7.6 }, { f: F4, d: 0.32, t: 8.0 },
          { f: C5, d: 0.32, t: 8.4 }, { f: F5, d: 0.32, t: 8.8 }, { f: C5, d: 0.65, t: 9.2 },

          // Phrase 4 (Cadence)
          { f: F5, d: 0.32, t: 10.0 }, { f: D5, d: 0.32, t: 10.4 }, { f: C5, d: 0.32, t: 10.8 }, { f: B4, d: 0.32, t: 11.2 },
          { f: A4, d: 0.38, t: 11.6 }, { f: G4, d: 0.38, t: 12.0 }, { f: F4, d: 0.85, t: 12.4 },

          // Second Loop / Climax with syncopated harmony
          { f: C5, d: 0.32, t: 13.6 }, { f: F5, d: 0.32, t: 14.0 }, { f: C5, d: 0.32, t: 14.4 }, { f: F4, d: 0.32, t: 14.8 },
          { f: C5, d: 0.32, t: 15.2 }, { f: F5, d: 0.32, t: 15.6 }, { f: C5, d: 0.65, t: 16.0 },

          { f: C5, d: 0.32, t: 16.8 }, { f: F5, d: 0.32, t: 17.2 }, { f: C5, d: 0.32, t: 17.6 }, { f: F5, d: 0.32, t: 18.0 },
          { f: A5, d: 0.45, t: 18.4 }, { f: G5, d: 0.32, t: 18.9 }, { f: F5, d: 0.32, t: 19.3 }, { f: E5, d: 0.32, t: 19.7 },

          { f: C5, d: 0.32, t: 20.4 }, { f: F5, d: 0.32, t: 20.8 }, { f: C5, d: 0.32, t: 21.2 }, { f: F4, d: 0.32, t: 21.6 },
          { f: C5, d: 0.32, t: 22.0 }, { f: F5, d: 0.32, t: 22.4 }, { f: C5, d: 0.65, t: 22.8 },

          // Grand Final Cadence (The classic 30-second buzzer finish)
          { f: F5, d: 0.32, t: 23.6 }, { f: D5, d: 0.32, t: 24.0 }, { f: C5, d: 0.32, t: 24.4 }, { f: B4, d: 0.32, t: 24.8 },
          { f: A4, d: 0.32, t: 25.2 }, { f: G4, d: 0.32, t: 25.6 }, { f: F4, d: 0.45, t: 26.0 },
          { f: C4, d: 0.50, t: 26.8 }, { f: F4, d: 1.40, t: 27.5 }
        ];

        // Plucked acoustic bassline
        const bassline = [
          { f: F3, t: 0.0, d: 0.55 }, { f: C3, t: 0.8, d: 0.55 }, { f: F3, t: 1.6, d: 0.55 }, { f: C3, t: 2.4, d: 0.55 },
          { f: F3, t: 3.2, d: 0.55 }, { f: C3, t: 4.0, d: 0.55 }, { f: F3, t: 4.8, d: 0.55 }, { f: C3, t: 5.6, d: 0.55 },

        },

            { id: "civ5_1", value: 200, question: "Signed in 1919 at the Hall of Mirrors, this treaty formally ended World War I between Germany and the Allies.", answer: "Treaty of Versailles", isDailyDouble: false },
            { id: "civ5_2", value: 400, question: "The 1783 Treaty of Paris formally recognized the independence of this newly declared nation.", answer: "The United States of America", isDailyDouble: false },
            { id: "civ5_3", value: 600, question: "This 1494 agreement mediated by Pope Alexander VI divided newly discovered lands between Spain and Portugal.", answer: "Treaty of Tordesillas", isDailyDouble: false },
            { id: "civ5_4", value: 800, question: "The 1842 Treaty of Nanking concluded the First Opium War and ceded this island territory to Britain.", answer: "Hong Kong", isDailyDouble: true },
            { id: "civ5_5", value: 1000, question: "Signed in 1848, this treaty ended the Mexican-American War and established the Rio Grande border.", answer: "Treaty of Guadalupe Hidalgo", isDailyDouble: false }
          ]
        },
        {
          id: "civ_6",
          name: "RENAISSANCE MASTERS",
          clues: [
            { id: "civ6_1", value: 200, question: "He painted the Mona Lisa and designed elaborate conceptual sketches for flying machines.", answer: "Leonardo da Vinci", isDailyDouble: false },
            { id: "civ6_2", value: 400, question: "He sculpted the 17-foot marble statue of David and frescoed the ceiling of the Sistine Chapel.", answer: "Michelangelo", isDailyDouble: false },
            { id: "civ6_3", value: 600, question: "This Florentine master painted The Birth of Venus and Primavera.", answer: "Sandro Botticelli", isDailyDouble: false },
            { id: "civ6_4", value: 800, question: "His monumental Renaissance fresco 'The School of Athens' portrays Plato and Aristotle in debate.", answer: "Raphael", isDailyDouble: false },
            { id: "civ6_5", value: 1000, question: "This goldsmith and architect designed the majestic self-supporting brick dome of Florence Cathedral.", answer: "Filippo Brunelleschi", isDailyDouble: false }
          ]
        }
      ],
      finalJeopardy: {
        category: "ANCIENT ARCHAEOLOGY",
        question: "In 1974, local farmers digging a well near Xi'an accidentally uncovered thousands of life-sized terracotta warriors guarding this emperor's tomb.",
        answer: "Qin Shi Huang",
        notes: "The first emperor of a unified China."
      }
    };

    const BUILT_IN_PRESETS = [
      {
        id: 'preset_deluxe',
        name: 'Jeopardy! Deluxe Tournament (Default)',
        tag: 'General Trivia',
        author: 'Studio Archive',
        difficulty: 'Standard',
        description: 'Balanced broadcast tournament covering Science, World History, Cinema, Gaming, Geography, and Literature.',
        data: INITIAL_BOARD_DATA
      },
      {
        id: 'preset_pop_culture',
        name: 'Pop Culture & Gaming Showcase',
        tag: 'Pop Culture',
        author: 'Studio Archive',
        difficulty: 'Casual / Fun',
        description: 'Blockbusters, Gaming Icons, Hit Music, TV Classics, Food & Drink, and Famous Inventions.',
        data: POP_CULTURE_BOARD_DATA
      },
      {
        id: 'repo_stem',
        name: 'STEM, AI & Future Tech Challenge',
        tag: 'STEM & Sci-Fi',
        author: 'Curated Repository',
        difficulty: 'Advanced',
        description: 'Artificial Intelligence, Astrophysics, Computer Architecture, Biotech, Code, and Innovations.',
        data: STEM_FUTURE_TECH_BOARD_DATA
      },
      {
        id: 'repo_history',
        name: 'Chronicles of World Civilization',
        tag: 'History & Arts',
        author: 'Curated Repository',
        difficulty: 'Tournament Grade',
        description: 'Ancient Wonders, Imperial Capitals, Medieval Monarchs, Maritime Explorers, Treaties, and Renaissance Masters.',
        data: WORLD_CIVILIZATIONS_BOARD_DATA
      }
    ];

    // Clean strings for solo practice fuzzy-matching
    const cleanStr = (s) => {
      if (!s) return "";
      return s.toLowerCase()
        .replace(/^(what is|who is|where is|what are|who are|what's|who's|where's)\s+/i, '')
        .replace(/^(the|a|an)\s+/i, '')
        .replace(/[^a-z0-9\s]/g, '')
        .trim();
    };

    const isFuzzyMatch = (user, official) => {
      const u = cleanStr(user);
      const o = cleanStr(official);
      if (!u || !o) return false;
      if (u === o) return true;
      if (o.length > 3 && u.includes(o)) return true;
      if (u.length > 3 && o.includes(u)) return true;
      return false;
    };

    function JeopardyApp() {
      const [view, setView] = useState('game'); // 'game' | 'editor' | 'rules'
      const [gameMode, setGameMode] = useState('party'); // 'party' | 'solo'
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [volume, setVolume] = useState(0.6);
      const [isThemePlaying, setIsThemePlaying] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);

      const [hasRealAudio, setHasRealAudio] = useState(false);
      const [audioSourceName, setAudioSourceName] = useState(null);
      const [useRealAudio, setUseRealAudio] = useState(true);
      const audioFileInputRef = useRef(null);

      // JSON Board Library & Selection State
      const jsonBoardFileInputRef = useRef(null);
      const [isBoardModalOpen, setIsBoardModalOpen] = useState(false);
      const [boardModalTab, setBoardModalTab] = useState('repository'); // 'repository' | 'saved' | 'url'
      const [saveAsNameInput, setSaveAsNameInput] = useState("");
      
      // Repository URL Fetcher State
      const [repoFetchUrl, setRepoFetchUrl] = useState("");
      const [isFetchingRepo, setIsFetchingRepo] = useState(false);
      const [repoFetchError, setRepoFetchError] = useState(null);

      const [savedBoards, setSavedBoards] = useState(() => {
        const saved = localStorage.getItem('jeopardy_saved_boards_collection_v2');
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return BUILT_IN_PRESETS;
      });

      const [activeBoardId, setActiveBoardId] = useState(() => {
        return localStorage.getItem('jeopardy_active_board_id_v2') || 'preset_deluxe';
      });

      const [boardData, setBoardData] = useState(() => {
        const saved = localStorage.getItem('jeopardy_custom_board_deluxe_v2');
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return INITIAL_BOARD_DATA;
      });

      // Save collection to localStorage whenever it changes
      useEffect(() => {
        localStorage.setItem('jeopardy_saved_boards_collection_v2', JSON.stringify(savedBoards));
      }, [savedBoards]);

      // Players / Teams
      const [players, setPlayers] = useState([
        { id: 'p1', name: 'Team Blue', score: 0, color: '#3b82f6', key: '1' },
        { id: 'p2', name: 'Team Red', score: 0, color: '#ef4444', key: '2' },
        { id: 'p3', name: 'Team Gold', score: 0, color: '#eab308', key: '3' }
      ]);
      const [activePlayerId, setActivePlayerId] = useState('p1');
      const [buzzedPlayerId, setBuzzedPlayerId] = useState(null);

      // Active Clue Modal State
      const [answeredClues, setAnsweredClues] = useState(new Set());
      const [activeClue, setActiveClue] = useState(null);
      const [isClueAnswerRevealed, setIsClueAnswerRevealed] = useState(false);
      const [dailyDoubleWager, setDailyDoubleWager] = useState(0);
      const [isWageringStage, setIsWageringStage] = useState(false);
      const [soloInput, setSoloInput] = useState("");

      // Configurable Countdown Timers
      const [clueTimerDefault, setClueTimerDefault] = useState(() => {
        const saved = localStorage.getItem('jeopardy_clue_timer_default_v2');
        return saved ? Math.max(3, Number(saved)) : 15;
      });
      const [finalTimerDefault, setFinalTimerDefault] = useState(() => {
        const saved = localStorage.getItem('jeopardy_final_timer_default_v2');
        return saved ? Math.max(5, Number(saved)) : 30;
      });
      const [isTimerSettingsModalOpen, setIsTimerSettingsModalOpen] = useState(false);

      const [timerSeconds, setTimerSeconds] = useState(15);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      // Persist timer preferences
      useEffect(() => {
        localStorage.setItem('jeopardy_clue_timer_default_v2', clueTimerDefault);
      }, [clueTimerDefault]);

      useEffect(() => {
        localStorage.setItem('jeopardy_final_timer_default_v2', finalTimerDefault);
      }, [finalTimerDefault]);

      // Final Jeopardy State
      const [isFinalModal, setIsFinalModal] = useState(false);
      const [finalStage, setFinalStage] = useState('wager'); // 'wager' | 'question' | 'reveal' | 'winner'
      const [finalWagers, setFinalWagers] = useState({});
      const [finalAnswers, setFinalAnswers] = useState({});
      const [finalResults, setFinalResults] = useState({}); // { [playerId]: boolean }

      // Synchronize sound settings
      useEffect(() => {
        soundEngine.muted = !soundEnabled;
        soundEngine.setVolume(volume);
        soundEngine.useRealAudio = useRealAudio;
      }, [soundEnabled, volume, useRealAudio]);

      // Automatically test if a local 'think.mp3' file exists in the website directory (e.g. on Netlify)
      useEffect(() => {
        const testLocalAudio = new Audio('think.mp3');
        testLocalAudio.addEventListener('canplaythrough', () => {
          soundEngine.setRealAudioSource('think.mp3', 'think.mp3');
          setHasRealAudio(true);
          setAudioSourceName('think.mp3 (Auto-Detected)');
        }, { once: true });
        testLocalAudio.addEventListener('error', () => {
          // No think.mp3 file detected; ready for file picker upload
        }, { once: true });
      }, []);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3200);
      };

      // Handle user uploading their authentic Jeopardy MP3/WAV/M4A file
      const handleAudioUpload = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          const blobUrl = URL.createObjectURL(file);
          soundEngine.setRealAudioSource(blobUrl, file.name);
          setHasRealAudio(true);
          setAudioSourceName(file.name);
          setUseRealAudio(true);
          showToast(`Loaded "${file.name}" as Real "Think!" sound!`);
        }
      };

      // Toggle Theme Music manually
      const toggleThemeMusic = () => {
        if (isThemePlaying) {
          soundEngine.stopJeopardyTheme();
          setIsThemePlaying(false);
          showToast("Theme music stopped");
        } else {
          soundEngine.startJeopardyTheme();
          setIsThemePlaying(true);
          showToast(hasRealAudio && useRealAudio ? `🎵 Playing Real Audio (${audioSourceName})` : "🎵 Playing Studio 'Think!' Theme");
        }
      };

      // Keyboard Buzzer Listeners for Party Mode
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (view !== 'game' || !activeClue || isWageringStage || isClueAnswerRevealed) return;
          // Number keys 1 through 6 map to teams
          const matchedPlayer = players.find(p => p.key === e.key);
          if (matchedPlayer && !buzzedPlayerId) {
            setBuzzedPlayerId(matchedPlayer.id);
            setActivePlayerId(matchedPlayer.id);
            soundEngine.playBuzz();
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [view, activeClue, isWageringStage, isClueAnswerRevealed, buzzedPlayerId, players]);

      // Timer countdown effect
      useEffect(() => {
        let interval = null;
        if (isTimerRunning && timerSeconds > 0) {
          interval = setInterval(() => {
            setTimerSeconds(prev => {
              if (prev <= 4 && prev > 1) soundEngine.playTick();
              if (prev <= 1) {
                soundEngine.playTimeout();
                setIsTimerRunning(false);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, timerSeconds]);

      const totalClues = useMemo(() => {
        return boardData.categories.reduce((acc, cat) => acc + cat.clues.length, 0);
      }, [boardData]);

      // Clue Selection Handler
      const handleSelectClue = (categoryName, clue) => {
        if (answeredClues.has(clue.id)) return;
        soundEngine.playClueSelect();
        setIsClueAnswerRevealed(false);
        setBuzzedPlayerId(gameMode === 'solo' ? players[0]?.id : null);
        setSoloInput("");

        const clueObj = { ...clue, categoryName };
        setActiveClue(clueObj);

        if (clue.isDailyDouble) {
          setIsWageringStage(true);
          soundEngine.playDailyDouble();
          const currP = players.find(p => p.id === activePlayerId) || players[0];
          const maxW = Math.max(1000, currP ? currP.score : 1000);
          setDailyDoubleWager(Math.min(clue.value, maxW));
          setIsTimerRunning(false);
        } else {
          setIsWageringStage(false);
          setTimerSeconds(clueTimerDefault);
          setIsTimerRunning(true);
        }
      };

      const handleConfirmWager = () => {
        setIsWageringStage(false);
        setTimerSeconds(Math.max(15, clueTimerDefault + 5));
        setIsTimerRunning(true);
        soundEngine.playClueSelect();
      };

      const handleScoreChange = (playerId, delta) => {
        setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, score: p.score + delta } : p));
      };

      const handleJudge = (isCorrect) => {
        if (!activeClue) return;
        const val = activeClue.isDailyDouble ? dailyDoubleWager : activeClue.value;
        const targetId = buzzedPlayerId || activePlayerId;

        if (isCorrect) {
          soundEngine.playCorrect();
          handleScoreChange(targetId, val);
          setActivePlayerId(targetId);
          closeClue(true);
        } else {
          soundEngine.playWrong();
          handleScoreChange(targetId, -val);
          if (gameMode === 'party' && !activeClue.isDailyDouble) {
            setBuzzedPlayerId(null);
          } else {
            closeClue(true);
          }
        }
      };

      const handleSoloSubmit = (e) => {
        e.preventDefault();
        if (!soloInput.trim() || !activeClue) return;
        const correct = isFuzzyMatch(soloInput, activeClue.answer);
        if (correct) {
          soundEngine.playCorrect();
          handleScoreChange(players[0].id, activeClue.value);
        } else {
          soundEngine.playWrong();
          handleScoreChange(players[0].id, -activeClue.value);
        }
        setIsClueAnswerRevealed(true);
        setIsTimerRunning(false);
      };

      const closeClue = (markAnswered = true) => {
        if (activeClue && markAnswered) {
          setAnsweredClues(prev => new Set(prev).add(activeClue.id));
        }
        setActiveClue(null);
        setIsTimerRunning(false);
        setIsClueAnswerRevealed(false);
        setBuzzedPlayerId(null);
      };

      const triggerConfetti = () => {
        if (window.confetti) {
          window.confetti({
            particleCount: 220,
            spread: 100,
            origin: { y: 0.6 }
          });
        }
      };

      // Final Jeopardy Handlers
      const startFinalJeopardy = () => {
        soundEngine.playFinalStinger();
        setIsFinalModal(true);
        setFinalStage('wager');
        const initW = {};
        const initA = {};
        const initR = {};
        players.forEach(p => {
          initW[p.id] = p.score > 0 ? Math.min(p.score, 1000) : 0;
          initA[p.id] = "";
          initR[p.id] = null;
        });
        setFinalWagers(initW);
        setFinalAnswers(initA);
        setFinalResults(initR);
      };

      const handleFinalWagersProceed = () => {
        setFinalStage('question');
        setTimerSeconds(finalTimerDefault);
        setIsTimerRunning(true);
        // Start iconic Think theme for the final question countdown
        soundEngine.startJeopardyTheme(() => {
          soundEngine.playTimeout();
          setIsTimerRunning(false);
        });
        setIsThemePlaying(true);
      };

      const handleFinalAnswersProceed = () => {
        soundEngine.stopJeopardyTheme();
        setIsThemePlaying(false);
        setFinalStage('reveal');
        setIsTimerRunning(false);
      };

      const handleToggleFinalResult = (playerId, isCorrect) => {
        const currentResult = finalResults[playerId];
        const wager = Number(finalWagers[playerId]) || 0;

        if (currentResult === true) {
          handleScoreChange(playerId, -wager);
        } else if (currentResult === false) {
          handleScoreChange(playerId, wager);
        }

        handleScoreChange(playerId, isCorrect ? wager : -wager);
        setFinalResults(prev => ({ ...prev, [playerId]: isCorrect }));

        if (isCorrect) {
          soundEngine.playCorrect();
        } else {
          soundEngine.playWrong();
        }
      };

      const handleFinishTournament = () => {
        setFinalStage('winner');
        triggerConfetti();
        soundEngine.playBoardReveal();
      };

      const resetGame = () => {
        soundEngine.stopJeopardyTheme();
        setIsThemePlaying(false);
        setAnsweredClues(new Set());
        setActiveClue(null);
        setIsFinalModal(false);
        setFinalStage('wager');
        setPlayers(prev => prev.map(p => ({ ...p, score: 0 })));
        soundEngine.playBoardReveal();
        showToast("Board and scores have been reset.");
      };

      const addPlayer = () => {
        if (players.length >= 6) return;
        const colors = ['#3b82f6', '#ef4444', '#eab308', '#10b981', '#8b5cf6', '#ec4899'];
        const p = {
          id: 'p_' + Date.now(),
          name: `Team ${players.length + 1}`,
          score: 0,
          color: colors[players.length % colors.length],
          key: String(players.length + 1)
        };
        setPlayers([...players, p]);
      };

      const removePlayer = (id) => {
        if (players.length <= 1) return;
        setPlayers(players.filter(p => p.id !== id));
      };

      // Board Management Functions
      const handleSelectBoard = (boardItem) => {
        setBoardData(boardItem.data);
        setActiveBoardId(boardItem.id);
        localStorage.setItem('jeopardy_active_board_id_v2', boardItem.id);
        localStorage.setItem('jeopardy_custom_board_deluxe_v2', JSON.stringify(boardItem.data));
        
        // Reset in-game state for clean new match
        setAnsweredClues(new Set());
        setActiveClue(null);
        setIsFinalModal(false);
        setPlayers(prev => prev.map(p => ({ ...p, score: 0 })));
        soundEngine.playBoardReveal();
        setIsBoardModalOpen(false);
        showToast(`Loaded Board: "${boardItem.name}"`);
      };

      const handleFetchFromRepoUrl = async (customUrl = null) => {
        let targetUrl = (customUrl || repoFetchUrl).trim();
        if (!targetUrl) {
          setRepoFetchError("Please enter a valid file URL or GitHub repository path.");
          return;
        }

        // Automatic GitHub blob to raw.githubusercontent.com conversion
        if (targetUrl.includes("github.com") && targetUrl.includes("/blob/")) {
          targetUrl = targetUrl
            .replace("github.com", "raw.githubusercontent.com")
            .replace("/blob/", "/");
        }

        setIsFetchingRepo(true);
        setRepoFetchError(null);

        try {
          const res = await fetch(targetUrl);
          if (!res.ok) {
            throw new Error(`HTTP Error ${res.status}: Failed to reach ${targetUrl}`);
          }
          const parsed = await res.json();

          if (!parsed.categories || !Array.isArray(parsed.categories)) {
            throw new Error("Invalid format: The JSON must contain a 'categories' array of 6 categories.");
          }

          const boardTitle = parsed.title || targetUrl.split("/").pop().replace(/\.json$/i, "") || "Repository Board";
          const newBoardId = 'repo_remote_' + Date.now();
          const remoteBoardItem = {
            id: newBoardId,
            name: boardTitle,
            tag: 'Remote Repo',
            author: targetUrl.includes("github") ? 'GitHub' : 'Web Repo',
            difficulty: 'Custom',
            description: `Fetched from: ${targetUrl}`,
            data: { ...parsed, title: boardTitle }
          };

          const updatedList = [...savedBoards, remoteBoardItem];
          setSavedBoards(updatedList);
          handleSelectBoard(remoteBoardItem);
          setRepoFetchUrl("");
          setIsFetchingRepo(false);
          showToast(`Successfully imported and loaded "${boardTitle}" from repository!`);
        } catch (err) {
          setIsFetchingRepo(false);
          setRepoFetchError(err.message || "Failed to download board from the repository.");
        }
      };

      const handleSaveCurrentAs = (e) => {
        e.preventDefault();
        const trimmed = saveAsNameInput.trim();
        if (!trimmed) {
          showToast("Please enter a name for your board.");
          return;
        }

        const newBoardId = 'user_board_' + Date.now();
        const newBoard = {
          id: newBoardId,
          name: trimmed,
          data: {
            ...boardData,
            title: trimmed
          }
        };

        const updatedList = [...savedBoards, newBoard];
        setSavedBoards(updatedList);
        setActiveBoardId(newBoardId);
        setBoardData(newBoard.data);
        localStorage.setItem('jeopardy_active_board_id_v2', newBoardId);
        localStorage.setItem('jeopardy_custom_board_deluxe_v2', JSON.stringify(newBoard.data));
        setSaveAsNameInput("");
        showToast(`Saved "${trimmed}" to your boards!`);
      };

      const handleDeleteBoard = (idToDelete) => {
        if (idToDelete.startsWith('preset_')) {
          showToast("Built-in presets cannot be deleted.");
          return;
        }
        const updated = savedBoards.filter(b => b.id !== idToDelete);
        setSavedBoards(updated);
        if (activeBoardId === idToDelete) {
          handleSelectBoard(BUILT_IN_PRESETS[0]);
        }
        showToast("Board removed from library.");
      };

      const handleDirectJSONFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (!parsed.categories || !Array.isArray(parsed.categories)) {
              throw new Error("Invalid structure: missing 'categories' array.");
            }
            const newName = parsed.title || file.name.replace(/\.[^/.]+$/, "");
            const newBoardId = 'import_board_' + Date.now();
            const newBoardItem = {
              id: newBoardId,
              name: newName,
              data: { ...parsed, title: newName }
            };

            const updated = [...savedBoards, newBoardItem];
            setSavedBoards(updated);
            handleSelectBoard(newBoardItem);
            showToast(`Imported and loaded "${newName}"!`);
          } catch (err) {
            showToast("Failed to parse JSON file: " + err.message);
          }
        };
        reader.readAsText(file);
        // Reset file input so user can re-upload same file if edited
        e.target.value = "";
      };

      const exportSpecificBoardJSON = (boardItem) => {
        const str = JSON.stringify(boardItem.data, null, 2);
        const blob = new Blob([str], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${boardItem.name.toLowerCase().replace(/[^a-z0-9]/g, '_')}_board.json`;
        a.click();
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100 selection:bg-amber-500 selection:text-slate-950">
          {/* Hidden JSON file picker input for instant import */}
          <input
            ref={jsonBoardFileInputRef}
            type="file"
            accept=".json,application/json"
            onChange={handleDirectJSONFileUpload}
            className="hidden"
          />

          {/* Studio Top Navigation Bar */}
          <header className="bg-slate-900/95 border-b border-blue-950 px-4 py-2.5 sticky top-0 z-40 backdrop-blur shadow-2xl flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center space-x-3">
              <div className="bg-gradient-to-tr from-amber-500 via-yellow-400 to-amber-300 text-blue-950 font-black text-xl font-board px-3.5 py-1 rounded shadow-lg tracking-widest border border-yellow-200 glow-gold">
                JEOPARDY!
              </div>
              <div className="hidden md:flex flex-col border-l border-blue-900/80 pl-3">
                <span className="text-xs font-bold uppercase tracking-widest text-amber-300">
                  {boardData.title}
                </span>
                <span className="text-[10px] text-blue-400 font-semibold tracking-wide">
                  Final: <span className="text-white font-bold">{boardData.finalJeopardy?.category || "Configured"}</span>
                </span>
              </div>
            </div>

            {/* Board Selector Quick Button */}

    function BoardEditorComponent({
      boardData,
      savedBoards,
      activeBoardId,
      onSelectBoard,
      onSaveCurrentAs,
      onTriggerFileUpload,
      setBoardData,
      onClose
    }) {
      const [board, setBoard] = useState(boardData);
      const [activeTab, setActiveTab] = useState('categories'); // 'categories' | 'final' | 'library'
      const [activeCat, setActiveCat] = useState(0);
      const [jsonText, setJsonText] = useState("");
      const [importError, setImportError] = useState(null);

      // Keep board local state in sync if boardData changes
      useEffect(() => {
        setBoard(boardData);
      }, [boardData]);

      const handleSave = () => {
        setBoardData(board);
        onClose();
      };

      const resetToDefault = () => {
        setBoard(INITIAL_BOARD_DATA);
        setBoardData(INITIAL_BOARD_DATA);
      };

      const exportJSON = () => {
        const str = JSON.stringify(board, null, 2);
        const blob = new Blob([str], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${(board.title || 'jeopardy_board').toLowerCase().replace(/[^a-z0-9]/g, '_')}_${Date.now()}.json`;
        a.click();
      };

      const handleImport = () => {
        try {
          const parsed = JSON.parse(jsonText);
          if (!parsed.categories || !Array.isArray(parsed.categories)) {
            throw new Error("Invalid structure: Missing 'categories' array.");
          }
          if (!parsed.finalJeopardy || !parsed.finalJeopardy.category) {
            throw new Error("Invalid structure: Missing 'finalJeopardy' object.");
          }
          setBoard(parsed);
          setBoardData(parsed);
          setImportError(null);
          onClose();
        } catch (e) {
          setImportError("Import failed: " + e.message);
        }
      };

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-4 sm:p-6 shadow-2xl space-y-6">
          <div className="flex flex-wrap items-center justify-between border-b border-slate-800 pb-4 gap-3">
            <div>
              <h2 className="text-xl font-bold font-board tracking-wider text-white flex items-center space-x-2">
                <span>🛠 Studio Board & Final Jeopardy Builder</span>
              </h2>
              <p className="text-xs text-slate-400">
                Editing: <strong className="text-amber-300">{board.title || "Custom Board"}</strong>

              <button

              >
                <span>📂 Upload .JSON</span>
              </button>
              <button
                onClick={resetToDefault}
                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl border border-slate-700 transition"
              >
                🔄 Reset Default
              </button>
              <button
                onClick={exportJSON}
                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700 transition"
              >
                📥 Export JSON
              </button>
              <button
                onClick={handleSave}
                className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black uppercase rounded-xl transition shadow"
              >
                💾 Save & Apply
              </button>
            </div>
          </div>

          {/* Top Tabs: Standard Board vs Final Jeopardy vs Board Library */}
          <div className="flex space-x-2 border-b border-slate-800 pb-2">
            <button
              onClick={() => setActiveTab('categories')}
              className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'categories' ? 'bg-blue-600 text-white shadow' : 'bg-slate-800 text-slate-400 hover:text-white'}`}

                            updated.categories[activeCat].clues[cIdx].answer = e.target.value;
                            setBoard(updated);
                          }}

                        />
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

              <div className="flex items-center justify-between border-b border-slate-800 pb-3">

                  <span>★ Final Jeopardy Customization</span>
                </h3>
                <span className="text-[10px] bg-amber-400/20 text-amber-300 border border-amber-400/40 px-2.5 py-0.5 rounded-full font-mono">

                </span>
              </div>

              <div className="space-y-3">
                <div>
                  <label className="text-xs font-bold text-slate-400 uppercase block mb-1">
                    Final Jeopardy Category Name:
                  </label>
                  <input
                    type="text"
                    value={board.finalJeopardy?.category || ""}
                    onChange={(e) => {
                      setBoard({
                        ...board,
                        finalJeopardy: { ...board.finalJeopardy, category: e.target.value }
                      });
                    }}
                    placeholder="e.g. FAMOUS LANDMARKS, WORLD HISTORY..."

            <p><strong className="text-white">3. Daily Doubles:</strong> Allows the player who picked the tile to wager any amount up to their current bankroll (or minimum $1,000).</p>
            <p><strong className="text-white">4. Buzzers & Modes:</strong> In Party Mode, players can press their on-screen button or press keyboard numbers <code className="bg-slate-800 text-amber-400 px-1.5 py-0.5 rounded">1-6</code>. In Solo Mode, submit typed answers for auto-grading.</p>
            <p><strong className="text-white">5. Custom Countdown Timers:</strong> Use the <span className="bg-slate-950 text-amber-300 border border-amber-500/50 px-1.5 py-0.5 rounded font-bold">⏱ Timer: Xs</span> button in the control ribbon to select presets (5s, 10s, 15s, 20s, 30s, 45s) or set custom durations for both standard clues and Final Jeopardy. You can also pause/resume (`⏸`/`▶`), add (`+5s`), or deduct (`-5s`) time mid-clue.</p>
            <p><strong className="text-white">6. Final Jeopardy & Custom Boards:</strong> You can edit the Final Jeopardy category, question, answer, and notes anytime in the Board Editor tab, and export everything into reusable JSON files!</p>
          </div>
          <button
            onClick={onStart}
            className="w-full py-3.5 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 text-slate-950 font-black uppercase tracking-wider rounded-2xl transition shadow-xl glow-gold"
          >
            Back to Game Board
          </button>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<JeopardyApp />);
  </script>
</body>
</html>
